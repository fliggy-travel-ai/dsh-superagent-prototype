<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub 订阅插件 · 界面稿</title>
<style>
/* ---------- 宿主主题色（插件只用这些） ---------- */
:root, [data-theme="light"] {
  --bg: #ffffff;          /* 表面：主区域 */
  --surface: #f6f6f6;     /* 表面：侧边栏、卡片 */
  --surface-2: #ececee;   /* 表面：选中、胶囊按下 */
  --surface-3: #fafafa;   /* 表面：输入框 */
  --fg: #1f1f22;          /* 前景 */
  --fg-muted: #8a8a90;    /* 次要前景 */
  --border: #e4e4e7;      /* 边框 */
  --accent: #2f6bf0;      /* 强调色 */
  --accent-fg: #ffffff;
  --success: #2e9a52;
  --warning: #c27a07;
  --danger: #d6403a;
  --shadow: 0 10px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  --canvas: #e7e7ea;
}
[data-theme="dark"] {
  --bg: #151517;
  --surface: #1c1c1f;
  --surface-2: #2b2b2f;
  --surface-3: #1f1f22;
  --fg: #ececef;
  --fg-muted: #8e8e95;
  --border: #303035;
  --accent: #5b8cff;
  --accent-fg: #ffffff;
  --success: #4cc274;
  --warning: #e3a33b;
  --danger: #ff6b66;
  --shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  --canvas: #0b0b0c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
  background: var(--canvas); color: var(--fg); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
svg.i.s14 { width: 14px; height: 14px; }
svg.i.s18 { width: 18px; height: 18px; }
svg.i.s12 { width: 12px; height: 12px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.muted { color: var(--fg-muted); }
.ok { color: var(--success); } .warn { color: var(--warning); } .bad { color: var(--danger); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---------- 界面稿外壳（不属于插件） ---------- */
.mock-bar {
  position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 10px 20px; background: #26262a; color: #e8e8ea; font-size: 13px;
}
.mock-bar .grp { display: flex; align-items: center; gap: 6px; }
.mock-bar .lbl { color: #9c9ca3; margin-right: 2px; }
.mock-bar button { padding: 4px 10px; border-radius: 6px; background: #35353a; color: #d8d8dc; }
.mock-bar button.on { background: #e8e8ea; color: #1b1b1d; }
.mock-wrap { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.mock-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.mock-notes { max-width: 1280px; width: 100%; font-size: 13px; color: var(--fg-muted); border: 1px dashed var(--fg-muted); border-radius: 10px; padding: 10px 14px; }
.mock-notes ul { margin: 4px 0 0; padding-left: 18px; }
body.shot .mock-bar, body.shot .mock-notes, body.shot .mock-title { display: none; }
body.shot .mock-wrap { padding: 0; }
body.shot .frame { border-radius: 0; box-shadow: none; }

/* ---------- 应用窗口 ---------- */
.frame { background: var(--bg); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); position: relative; border: 1px solid var(--border); }
.frame.desktop { width: 1280px; height: 800px; display: flex; }
.frame.phone { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #111; display: flex; flex-direction: column; }
body.shot .frame.phone { border-radius: 0; border: 0; }

/* 侧边栏 */
.sb { width: 264px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; }
.traffic { display: flex; gap: 8px; padding: 4px 8px 14px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block; }
.traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }
.sb-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; color: var(--fg); font-size: 15px; width: 100%; text-align: left; }
.sb-item svg { color: var(--fg-muted); width: 18px; height: 18px; }
.sb-item:hover { background: var(--surface-2); }
.sb-item.sel { background: var(--surface-2); }
.sb-item .grow { flex: 1; }
.badge { font-size: 12px; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg-muted); display: inline-flex; align-items: center; justify-content: center; gap: 3px; }
.sb-item.sel .badge { background: var(--bg); }
.badge.warn { background: transparent; border: 1px solid var(--warning); color: var(--warning); }
.sb-sep { height: 1px; background: var(--border); margin: 8px 4px; }
.sb-label { font-size: 13px; color: var(--fg-muted); padding: 6px 10px 4px; }
.sb-row { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 9px; font-size: 14px; }
.sb-row.sel { background: var(--surface-2); }
.av { width: 20px; height: 20px; border-radius: 5px; color: #fff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.sb-row .t { flex: 1; } .sb-row .tm { color: var(--fg-muted); font-size: 12px; }

/* 主区域 */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.topbar .title { font-weight: 600; font-size: 15px; }
.topbar .sub { color: var(--fg-muted); font-size: 13px; }
.timeline { flex: 1; overflow: hidden; padding: 22px 0; }
.col { max-width: 760px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 16px; }
.msg-user { align-self: flex-end; max-width: 82%; background: var(--surface-2); border-radius: 16px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
.msg-user.plugin { font-size: 13.5px; }
.msg-ai { white-space: pre-wrap; }
.tool { display: flex; align-items: center; gap: 8px; color: var(--fg-muted); font-size: 13px; }
.tool code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.working { display: flex; gap: 8px; align-items: center; color: var(--fg-muted); font-size: 13px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.link { color: var(--accent); }

/* 输入区 */
.composer { flex: none; padding: 0 0 18px; }
.composer .col { gap: 10px; }
.pills { display: flex; gap: 8px; align-items: center; position: relative; }
.pill { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg-muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pill:hover, .pill.on { background: var(--surface-2); color: var(--fg); }
.pill .gh { width: 14px; height: 14px; }
.pill-anchor { position: relative; }
.input { border: 1px solid var(--border); background: var(--surface-3); border-radius: 18px; padding: 14px 16px 10px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; }
.input .ph { color: var(--fg-muted); font-size: 15px; }
.input .row { display: flex; align-items: center; gap: 8px; color: var(--fg-muted); font-size: 13px; }
.input .send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; }

/* 弹出层 */
.pop { position: absolute; bottom: calc(100% + 8px); left: 0; width: 480px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); z-index: 10; overflow: hidden; }
.pop-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-weight: 600; }
.pop-h .muted { font-weight: 400; font-size: 13px; }
.sub-row { display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); align-items: flex-start; }
.sub-row .ic { margin-top: 2px; }
.sub-row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sub-row .l1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.sub-row .obj { font-weight: 600; white-space: nowrap; }
.sub-row .l3 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.chip { font-size: 12px; height: 20px; line-height: 18px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg-muted); background: var(--surface); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.chip.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
.btn { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 13px; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-muted); }
.btn.danger { color: var(--danger); }
.pop-f { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
.pop-f a, .pop-f button { color: var(--accent); display: inline-flex; gap: 4px; align-items: center; }

/* 全局页面 */
.page { flex: 1; overflow: auto; padding: 24px 32px; }
.page-h { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.page-h h1 { font-size: 22px; margin: 0; font-weight: 650; }
.page-sub { color: var(--fg-muted); font-size: 13px; margin-bottom: 18px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { height: 28px; padding: 0 14px; border-radius: 7px; color: var(--fg-muted); font-size: 13.5px; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); border: 1px solid var(--border); }
.seg.small button { height: 24px; padding: 0 10px; font-size: 12.5px; }
.toolbar { display: flex; align-items: center; gap: 12px; margin: 16px 0 12px; flex-wrap: wrap; }
.toolbar .sp { flex: 1; }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.card + .card { margin-top: 14px; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13.5px; }
.card-h .muted { font-weight: 400; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th { text-align: left; font-weight: 500; color: var(--fg-muted); font-size: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13.5px; }
.tbl tr:last-child td { border-bottom: 0; }
.tree { display: inline-block; width: 18px; color: var(--fg-muted); }
.cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; white-space: nowrap; }
.tbl td .st.bad { white-space: normal; align-items: flex-start; overflow-wrap: anywhere; }
.iconbtn { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg-muted); }
.iconbtn:hover { background: var(--surface-2); color: var(--fg); }
.ev { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.ev:last-child { border-bottom: 0; }
.ev .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ev .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.ev .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ev .quote { color: var(--fg-muted); font-size: 13px; border-left: 2px solid var(--border); padding-left: 8px; }
.ev .to { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.to-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; }
.filtered { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; color: var(--fg-muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
.stat { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.stat .k { color: var(--fg-muted); font-size: 12.5px; }
.stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--fg-muted); font-weight: 500; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--fg-muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warning); color: var(--fg); background: color-mix(in srgb, var(--warning) 8%, var(--bg)); margin-bottom: 14px; font-size: 13.5px; }
.banner svg { color: var(--warning); margin-top: 2px; }
.banner.ok { border-color: var(--border); background: var(--surface); }
.banner.ok svg { color: var(--success); }
.empty { border: 1px dashed var(--border); border-radius: 14px; padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .big { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--fg-muted); }
.empty h3 { margin: 4px 0 0; font-size: 16px; }
.empty p { margin: 0; color: var(--fg-muted); max-width: 440px; }
code.m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }

/* 设置页 */
.set-nav { width: 220px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.set-nav .sb-item { font-size: 14px; height: 34px; }
.set-main { flex: 1; overflow: auto; padding: 22px 40px 40px; }
.set-inner { max-width: 720px; }
.crumb { display: flex; align-items: center; gap: 4px; color: var(--fg-muted); font-size: 13px; margin-bottom: 8px; }
.set-sec { margin-top: 22px; }
.set-sec > h3 { font-size: 13px; color: var(--fg-muted); font-weight: 500; margin: 0 0 8px 2px; }
.set-card { border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.set-row { display: flex; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.set-row:last-child { border-bottom: 0; }
.set-row .lab { flex: 1; min-width: 0; }
.set-row .lab b { font-weight: 500; display: block; }
.set-row .lab span { color: var(--fg-muted); font-size: 12.5px; }
.set-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.field { height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-3); padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--fg); }
.field.num { width: 92px; justify-content: space-between; font-variant-numeric: tabular-nums; }
.field.wide { flex: 1; }
.field .unit { color: var(--fg-muted); font-size: 12.5px; }
.field.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.sw { width: 40px; height: 24px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw.on::after { left: 18px; }
.chips-edit { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips-edit .chip { height: 26px; padding: 0 6px 0 10px; font-size: 13px; color: var(--fg); }
.chips-edit .chip svg { color: var(--fg-muted); }
.select { height: 30px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--bg); white-space: nowrap; }
.check-ok { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.hint { font-size: 12.5px; color: var(--fg-muted); }
.fixbox { border: 1px solid var(--warning); border-radius: 10px; padding: 10px 12px; font-size: 13px; background: color-mix(in srgb, var(--warning) 7%, var(--bg)); display: flex; flex-direction: column; gap: 6px; }

/* 手机 */
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-weight: 600; font-size: 14px; background: var(--bg); }
.m-top { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.m-top .title { font-weight: 600; flex: 1; }
.phone .col { padding: 0 14px; }
.phone .timeline { padding: 14px 0; }
.phone .composer { padding-bottom: 26px; }
.phone .input { min-height: 84px; }
.phone .page { padding: 14px; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 18px 18px 0 0; z-index: 21; box-shadow: var(--shadow); padding-bottom: 24px; }
.sheet .handle { width: 38px; height: 5px; border-radius: 999px; background: var(--surface-2); margin: 8px auto 4px; }
.sheet .sub-row { padding: 12px 16px; }
.m-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.m-list { display: flex; flex-direction: column; gap: 10px; }
.m-group { font-size: 12.5px; color: var(--fg-muted); margin: 12px 2px 0; display: flex; align-items: center; gap: 6px; }
.phone .stats { grid-template-columns: 1fr; gap: 10px; }
.phone .seg { display: flex; } .phone .seg button { flex: 1; }
</style>
</head>

function subsBySession() {
  const roots = Object.keys(SESS).filter(k => !SESS[k].parent);
  const block = (k, depth) => {
    const list = SUBS.filter(x => x.s === k);
    const kids = Object.keys(SESS).filter(c => SESS[c].parent === k);
    const head = `<tr><td colspan="4" style="background:var(--surface)"><div class="cell" style="padding-left:${depth * 22}px">${depth ? '<span class="tree">└</span>' : ''}${av(k)}<b style="font-weight:600">${SESS[k].name}</b><span class="muted">${SESS[k].prov} · ${list.length} 个订阅${kids.length ? ` · ${kids.length} 个子会话` : ''}</span></div></td>
      <td style="background:var(--surface);text-align:right"><button class="iconbtn" title="跳到会话">${ic('jump')}</button></td></tr>`;
    const rows = list.map(x => `<tr><td><div class="cell" style="padding-left:${depth * 22 + 28}px"><span class="muted">${ic(kindIcon(x.kind), 's14')}</span><b style="font-weight:600;white-space:nowrap">${objText(x)}</b></div></td>
      <td><span class="muted ell" style="display:block">${x.num ? x.title : '整个仓库'}</span></td>
      <td><div class="cell" style="flex-wrap:wrap;gap:4px">${chips(x.ev)}</div></td>
      <td><div style="display:flex;flex-direction:column;gap:2px"><span>${x.last || '—'}</span>${stHtml(x.st)}</div></td>
      <td style="text-align:right"><button class="iconbtn" title="取消订阅">${ic('x')}</button></td></tr>`).join('');
    return head + rows + kids.map(c => block(c, depth + 1)).join('');
  };
  return `<div class="card"><table class="tbl"><colgroup><col style="width:30%"><col style="width:27%"><col style="width:18%"><col style="width:18%"><col style="width:7%"></colgroup>

}

    '底部链接打开 GitHub 订阅页。手机布局下变为底部弹出的面板。'],
  subs: ['订阅可按仓库或按会话分组；子会话用“└”归在主会话下。每行可跳到会话或取消订阅。',
    '最近送达结果：已送达、可能已送达（黄）、送达失败将重试（红）、会话忙跳过本轮（灰）、暂无事件。'],

  monitor: ['每个仓库的最后一次轮询、未变化命中率（条件请求返回“未变化”的比例，不计额度）、本小时请求数和错误。',
    '额度条区分本插件用量和同一账号其他会话的用量。顶部切到“有问题”可看出错样式。'],
  settings: ['令牌保存后只显示前缀和账号；“检查令牌”显示账号、令牌类型和剩余额度。',

  'empty-chat': ['会话没有订阅时，输入框上方只有“5 个 subagent”，不显示 GitHub 胶囊；侧边栏入口不显示徽标。'],
  'empty-page': ['全部会话都没有订阅时，订阅页显示空状态和用法提示，同时给出监听状态，说明插件在正常运行。'],
};

// ---------------- 渲染 ----------------
function render() {
  document.documentElement.dataset.theme = S.t;
  document.body.classList.toggle('shot', S.shot);
  const b = (k, v, t) => `<button class="${S[k] === v ? 'on' : ''}" data-set="${k}=${v}">${t}</button>`;
  document.getElementById('bar').innerHTML = `
    <div class="grp"><span class="lbl">主题</span>${b('t', 'light', '浅色')}${b('t', 'dark', '深色')}</div>
    <div class="grp"><span class="lbl">布局</span>${b('l', 'desktop', '桌面宽布局')}${b('l', 'phone', '手机紧凑布局')}</div>
    <div class="grp"><span class="lbl">示例状态</span>${b('p', 'ok', '正常')}${b('p', 'bad', '有问题')}</div>
    <div class="grp"><span class="lbl">画面</span>${SCREENS.map(([k, v]) => b('s', k, v)).join('')}</div>
    ${S.removed.size ? '<div class="grp"><button data-reset>恢复已取消的订阅</button></div>' : ''}`;
  const d = S.l === 'desktop';
  let html;
  if (S.s === 'chat' || S.s === 'empty-chat') html = d ? chatDesktop(false) : chatPhone(false);
  else if (S.s === 'popover') html = d ? chatDesktop(true) : chatPhone(true);
  else if (S.s === 'settings') html = d ? settingsDesktop() : settingsPhone();
  else html = d ? pageDesktop() : pagePhone();
  document.getElementById('stage').innerHTML = html;
  document.getElementById('mtitle').textContent = SCREENS.find(x => x[0] === S.s)[1] + (d ? ' · 桌面' : ' · 手机') + (S.t === 'dark' ? ' · 深色' : ' · 浅色');
  document.getElementById('notes').innerHTML = '说明<ul>' + (NOTES[S.s] || []).map(n => `<li>${n}</li>`).join('') + '</ul>';
  writeHash();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-set],[data-go],[data-unsub],[data-g],[data-f],[data-reset]');
  if (!el) return;
  if (el.dataset.set) { const [k, v] = el.dataset.set.split('='); S[k] = v; }
  else if (el.dataset.go) S.s = el.dataset.go;
  else if (el.dataset.unsub) { S.removed.add(el.dataset.unsub); if (!mySubs().length) S.s = 'chat'; }
  else if (el.dataset.g) S.g = el.dataset.g;
  else if (el.dataset.f) S.f = el.dataset.f;
  else if ('reset' in el.dataset) S.removed.clear();
  render();
});
readHash(); render();
</script>
