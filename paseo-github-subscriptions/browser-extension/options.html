<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>开发自动化</title>
<body><h1>开发自动化</h1><p>安装后自动同意 Claude Code 网页权限请求，并按会话名称分组。无需配置。</p><label><input id="approvalEnabled" type="checkbox" checked>自动点同意</label><p>安装前已打开的 Claude 网页，刷新一次即可生效。关闭此扩展即可停止自动点击和分组。</p><details><summary>高级设置：关联 Paseo 会话名称（可选）</summary><form id="name"><label>浏览器环境名称 <input id="instanceName" maxlength="120" required></label><br><label>AdsPower 环境序号或 ID（可选） <input id="adspowerProfile" maxlength="120" placeholder="如 29"></label><br><button>保存名称</button></form><form id="pair"><label>本机配对 URL <input id="url" type="url" required></label><br><label>配对令牌 <input id="token" type="password" required autocomplete="off"></label><br><button>保存配对</button></form><button id="clear">解除配对</button><p>重置身份后，本浏览器将使用新身份，原身份的会话绑定不再适用于本环境；现有标签组不会删除。</p><button id="resetIdentity">重置本浏览器环境身份</button></details><p id="status"></p><script src="options.js"></script></body></html>
